<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - CampusCircle</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="center-screen">
  <div class="auth-box">
    <div class="logo"><span class="mark">🎯</span><span class="name">CampusCircle</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Log in to see opportunities matched to you.</p>

    <div class="form-error" id="formError"></div>

    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@college.edu" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Login</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="/register">Create one</a></p>
    <p class="auth-switch" style="margin-top:6px;">Demo: <b>arjun@campuscircle.edu</b> / <b>Password@123</b></p>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = document.getElementById("formError");
    errBox.classList.remove("show");
    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = "Logging in...";
    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const data = await api("/auth/login", { method: "POST", body: { email, password }, auth: false });
      setSession(data.access_token, data.user);
      window.location.href = "/app";
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Login";
    }
  });
</script>
</body>
</html>
